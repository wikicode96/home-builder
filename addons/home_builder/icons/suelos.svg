<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="isoFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C99B" />
      <stop offset="100%" stop-color="#C9A16E" />
    </linearGradient>
  </defs>

  <!-- Suelo isométrico -->
  <polygon points="16,5 27,16 16,27 5,16" fill="url(#isoFloor)" stroke="#A87B4D" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Juntas de baldosas isométricas (grid 3x3) -->
  <!-- Las 4 líneas van exactamente de borde a borde del rombo -->
  <g stroke="#A87B4D" stroke-width="0.8" opacity="0.5">
    <!-- Dirección ↘ (pendiente +1) -->
    <line x1="8.7" y1="12.3" x2="19.7" y2="23.3" />
    <line x1="12.3" y1="8.7" x2="23.3" y2="19.7" />
    <!-- Dirección ↙ (pendiente -1) -->
    <line x1="19.7" y1="8.7" x2="8.7" y2="19.7" />
    <line x1="23.3" y1="12.3" x2="12.3" y2="23.3" />
  </g>

  <!-- Brillo superior -->
  <polygon points="16,5 27,16 16,18 5,16" fill="white" opacity="0.12" />
  <polygon points="16,5 20,9 16,10 12,9" fill="white" opacity="0.2" />
</svg>
