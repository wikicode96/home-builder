<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="noneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A8A8A" />
      <stop offset="100%" stop-color="#585858" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#202020" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Círculo de fondo -->
  <circle cx="16" cy="16" r="12" fill="url(#noneGrad)" stroke="#404040" stroke-width="1.2" filter="url(#shadow)" />

  <!-- Cruz X -->
  <g stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <line x1="11" y1="11" x2="21" y2="21" />
    <line x1="21" y1="11" x2="11" y2="21" />
  </g>

  <!-- Brillo superior -->
  <path d="M 4,16 A 12,12 0 0,1 28,16 Z" fill="white" opacity="0.1" />
</svg>
